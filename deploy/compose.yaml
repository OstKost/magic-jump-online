services:
  app:
    image: ${JUMP_IMAGE:-jump:local}
    restart: unless-stopped
    ports:
      - '127.0.0.1:18083:8080'
    environment:
      PUBLIC_ORIGIN: https://jump.ost.wang
      DB_PATH: /data/jump.sqlite
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
